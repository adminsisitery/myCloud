# ============================================================
# myCloud Docker Compose —— 在服务器 /opt/mycloud/ 下执行:
#   docker compose build && docker compose up -d
# ============================================================
# 所有服务使用 host 网络，直接走 localhost 连中间件，
# .env 文件不需要任何修改。
# ============================================================

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: pan-gateway-1.0-SNAPSHOT.jar
    container_name: mycloud-gateway
    network_mode: host
    env_file: .env
    restart: always
    mem_limit: 400m

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
