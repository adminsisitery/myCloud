# ============================================================
# myCloud Docker Compose —— 在服务器 /opt/mycloud/ 下执行:
#   docker compose build && docker compose up -d
# ============================================================
# 网络模型：
#   - 全部服务接入自定义 bridge 网络 mycloud，容器之间用服务名互访
#   - 只有 gateway 发布 8090 到宿主机，其余服务不映射任何端口
#   - 中间件有两种放法，按部署形态选：
#       a) 容器化（推荐，P0-4）：与 docker-compose.middleware.yml 一起用，
#          中间件只在 mycloud 网络里，不发布任何宿主机端口；
#          在 .env 里设 MW_NACOS=nacos / MW_REDIS=redis / MW_RABBITMQ=rabbitmq /
#          MW_ELASTICSEARCH=elasticsearch / MW_PGVECTOR=postgres
#       b) 宿主机安装：默认走 host.docker.internal，
#          此时中间件必须监听 0.0.0.0 或 docker 网桥地址，且务必用强密码 + 防火墙
#          只放行 docker 网段（172.16.0.0/12），不要暴露到公网
#
# 与 deploy.sh + systemd 部署路径共存：
#   .env 里仍是 localhost（systemd 直跑宿主进程时正确），
#   compose 用 environment 覆盖成 host.docker.internal，互不影响。
# ============================================================

# 中间件地址覆盖（覆盖 .env 中的 localhost，仅容器内生效）
x-middleware-env: &middleware-env
  # MW_* 有默认值：不配就是宿主机中间件；配成服务名即切到容器化中间件
  NACOS_SERVER_ADDR: ${MW_NACOS:-host.docker.internal}:8848
  REDIS_HOST: ${MW_REDIS:-host.docker.internal}
  RABBITMQ_HOST: ${MW_RABBITMQ:-host.docker.internal}
  ELASTICSEARCH_URIS: http://${MW_ELASTICSEARCH:-host.docker.internal}:9200
  PGVECTOR_HOST: ${MW_PGVECTOR:-host.docker.internal}
  # 服务间已全部走 Feign + Nacos 服务发现，这两个变量当前无代码引用，
  # 仍指向服务名，避免将来有人用 RestClient 时误连容器自身 localhost
  USER_SERVICE_URL: http://user-service:8081
  FILE_MANAGE_SERVICE_URL: http://file-manage-service:8084

# 公共构建/运行配置
x-service-base: &service-base
  env_file: .env
  environment:
    <<: *middleware-env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - mycloud
  restart: always

services:
  gateway:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: pan-gateway-1.0-SNAPSHOT.jar
    container_name: mycloud-gateway
    # 唯一对外端口
    ports:
      - "8090:8090"
    mem_limit: 400m

  user-service:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: user-service-1.0-SNAPSHOT.jar
    container_name: mycloud-user-service
    mem_limit: 400m

  file-upload-service:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: file-upload-service-1.0-SNAPSHOT.jar
    container_name: mycloud-file-upload
    mem_limit: 400m

  file-download-service:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: file-download-service-1.0-SNAPSHOT.jar
    container_name: mycloud-file-download
    mem_limit: 400m

  file-manage-service:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: file-manage-service-1.0-SNAPSHOT.jar
    container_name: mycloud-file-manage
    mem_limit: 400m

  file-share-service:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: file-share-service-1.0-SNAPSHOT.jar
    container_name: mycloud-file-share
    mem_limit: 400m

  file-async-service:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: file-async-service-1.0-SNAPSHOT.jar
    container_name: mycloud-file-async
    mem_limit: 400m

  file-preview-service:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: file-preview-service-1.0-SNAPSHOT.jar
    container_name: mycloud-file-preview
    mem_limit: 400m

  ai-service:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: ai-service-1.0-SNAPSHOT.jar
    container_name: mycloud-ai-service
    mem_limit: 512m

  file-search-service:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: file-search-service-1.0-SNAPSHOT.jar
    container_name: mycloud-file-search
    mem_limit: 400m

  file-task-service:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: file-task-service-1.0-SNAPSHOT.jar
    container_name: mycloud-file-task
    mem_limit: 400m

networks:
  mycloud:
    driver: bridge
