# Woodpecker CI —— 轻量 CI/CD
# 访问: http://47.95.192.221:9090
# Agent 挂载 docker.sock，可直接操作 docker-compose 部署

services:
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:latest
    container_name: woodpecker-server
    ports:
      - "9090:8000"
    volumes:
      - woodpecker-data:/var/lib/woodpecker
    environment:
      - WOODPECKER_OPEN=true
      - WOODPECKER_HOST=http://47.95.192.221:9090
      - WOODPECKER_GITEA=true
      - WOODPECKER_GITEA_URL=https://gitee.com
      - WOODPECKER_GITEA_CLIENT=a9fe2aa6-30d5-4c39-8a93-7f0fdb4c0276
      - WOODPECKER_GITEA_SECRET=gitoa_4hFm8H4SRAZfqkAYEDbUZwB5OUK7Kdd7pe3T
      - WOODPECKER_AGENT_SECRET=woodpecker-agent-secret-change-me
    restart: always
    mem_limit: 200m

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:latest
    container_name: woodpecker-agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/mycloud:/opt/mycloud
    environment:
      - WOODPECKER_SERVER=woodpecker-server:9000
      - WOODPECKER_AGENT_SECRET=woodpecker-agent-secret-change-me
      - WOODPECKER_MAX_WORKFLOWS=1
    restart: always
    mem_limit: 300m

volumes:
  woodpecker-data: