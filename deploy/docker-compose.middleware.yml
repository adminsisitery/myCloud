# ============================================================
# myCloud 中间件编排（P0-4）
# ============================================================
# 设计目标：中间件只存在于容器网络里，不向宿主机发布任何端口。
#   - 公网访问不到（没有 ports 映射）
#   - 宿主机进程也访问不到（不监听 0.0.0.0）
#   - 只有同一张 mycloud 网络里的业务容器能连（用服务名）
#
# 用法：
#   1) .env 里把中间件地址指到服务名：
#        MW_NACOS=nacos
#        MW_REDIS=redis
#        MW_RABBITMQ=rabbitmq
#        MW_ELASTICSEARCH=elasticsearch
#        MW_PGVECTOR=postgres
#   2) 起服务：
#        docker compose -f docker-compose.yml -f docker-compose.middleware.yml up -d
#
# 注意：本文件必须和 docker-compose.yml 一起用（它复用后者声明的 mycloud 网络，
# 并且业务容器的 MW_* 变量来自同一份 .env）。
#
# 数据卷默认落在 compose 的 named volume 上，备份请用 mysqldump / pg_dump，
# 不要直接拷 /var/lib/docker。
# ============================================================

services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: mycloud-nacos
    environment:
      MODE: standalone
      # 与当前线上一致：未开鉴权。开鉴权需要额外配置 identity/token，见 docs/nacos-auth-setup.md
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks:
      - mycloud
    restart: always

  mysql:
    image: mysql:8.0
    container_name: mycloud-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 中间件不对外，不需要接受非本网络的连接
      - --bind-address=0.0.0.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mycloud}
      MYSQL_USER: ${MYSQL_USER:-mycloud}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 设置 MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - mycloud
    restart: always

  redis:
    image: redis:7-alpine
    container_name: mycloud-redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?请在 .env 设置 REDIS_PASSWORD}
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mycloud
    restart: always

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: mycloud-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mycloud}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请在 .env 设置 RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - mycloud
    restart: always

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: mycloud-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks:
      - mycloud
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    container_name: mycloud-postgres
    environment:
      POSTGRES_DB: ${PGVECTOR_DATABASE:-mycloud}
      POSTGRES_USER: ${PGVECTOR_USER:-mycloud}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:?请在 .env 设置 PGVECTOR_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USER:-mycloud} -d ${PGVECTOR_DATABASE:-mycloud}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mycloud
    restart: always

volumes:
  nacos-data:
  mysql-data:
  redis-data:
  rabbitmq-data:
  es-data:
  pg-data:
