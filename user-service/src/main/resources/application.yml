# 本地只保留启动引导配置，其余业务配置全部托管到 Nacos（DEFAULT_GROUP）
# 共享配置：pan-common / pan-mysql / pan-redis / pan-mybatis / pan-sa-token / pan-mail
# 服务独有配置：user-service（GitHub 登录）
server:
  port: ${USER_SERVICE_PORT:8081}

spring:
  application:
    name: user-service
  config:
    import:
      - "optional:nacos:pan-common?group=pan&refreshEnabled=true"
      - "optional:nacos:pan-mysql?group=pan&refreshEnabled=true"
      - "optional:nacos:pan-redis?group=pan&refreshEnabled=true"
      - "optional:nacos:pan-mybatis?group=pan&refreshEnabled=true"
      - "optional:nacos:pan-sa-token?group=pan&refreshEnabled=true"
      - "optional:nacos:pan-mail?group=pan&refreshEnabled=true"
      - "optional:nacos:user-service?group=pan&refreshEnabled=true"
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:47.95.192.221:8848}
      # Nacos 3.x 默认开启鉴权，需显式提供账号密码（2.x 默认关闭所以之前没配）
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: ${NACOS_SERVER_ADDR:47.95.192.221:8848}
        group: DEFAULT_GROUP
        file-extension: yaml
        refresh-enabled: true
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:47.95.192.221:8848}
