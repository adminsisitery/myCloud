# 本地只保留启动引导配置，其余业务配置全部托管到 Nacos（DEFAULT_GROUP）
# 共享配置：pan-common / pan-mysql / pan-redis / pan-mybatis-plus / pan-sa-token / pan-mail
# 服务独有配置：user-service（GitHub 登录）
server:
  port: ${USER_SERVICE_PORT:8081}

spring:
  application:
    name: user-service
  config:
    import:
      - "optional:nacos:pan-common?group=DEFAULT_GROUP&refreshEnabled=true"
      - "optional:nacos:pan-mysql?group=DEFAULT_GROUP&refreshEnabled=true"
      - "optional:nacos:pan-redis?group=DEFAULT_GROUP&refreshEnabled=true"
      - "optional:nacos:pan-mybatis-plus?group=DEFAULT_GROUP&refreshEnabled=true"
      - "optional:nacos:pan-sa-token?group=DEFAULT_GROUP&refreshEnabled=true"
      - "optional:nacos:pan-mail?group=DEFAULT_GROUP&refreshEnabled=true"
      - "optional:nacos:user-service?group=DEFAULT_GROUP&refreshEnabled=true"
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:47.95.192.221:8848}
      # Nacos 开启鉴权后必须提供；密码不落库，走环境变量 NACOS_PASSWORD
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:}
      config:
        server-addr: ${NACOS_SERVER_ADDR:47.95.192.221:8848}
        group: DEFAULT_GROUP
        file-extension: yaml
        refresh-enabled: true
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:47.95.192.221:8848}
