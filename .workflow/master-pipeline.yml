version: '1.0'
name: mycloud-ci
displayName: myCloud CI/CD 流水线

triggers:
  push:
    branches:
      include:
        - Microservices
        - master

variables:
  JDK_VERSION: 21

stages:
  - stage: build
    name: 构建阶段
    displayName: 编译打包
    steps:
      - step: build@maven
        name: maven-build
        displayName: Maven 编译 + 打包
        jdkVersion: ${JDK_VERSION}
        mavenVersion: 3.9.11
        commands:
          - mvn -DskipTests clean package -q
          - echo "=== 产物 ==="
          - find . -name "*-1.0-SNAPSHOT.jar" -exec ls -lh {} \;