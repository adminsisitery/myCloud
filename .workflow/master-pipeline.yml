version: '1.0'
name: mycloud-ci
displayName: myCloud CI/CD 流水线

triggers:
  push:
    branches:
      include:
        - Microservices
        - master

variables:
  JDK_VERSION: 21

stages:
  - stage: compile
    name: 编译阶段
    displayName: 编译
    steps:
      - step: build@maven
        name: maven-compile
        displayName: Maven 编译
        jdkVersion: ${JDK_VERSION}
        mavenVersion: 3.9.11
        commands:
          - mvn -DskipTests compile -q

  - stage: test
    name: 测试阶段
    displayName: 单元测试
    steps:
      - step: build@maven
        name: maven-test
        displayName: Maven 测试
        jdkVersion: ${JDK_VERSION}
        mavenVersion: 3.9.11
        commands:
          - mvn test --fail-at-end -q 2>&1 | tail -30

  - stage: package
    name: 打包阶段
    displayName: 打包
    steps:
      - step: build@maven
        name: maven-package
        displayName: Maven 打包
        jdkVersion: ${JDK_VERSION}
        mavenVersion: 3.9.11
        commands:
          - mvn -DskipTests clean package -q
          - echo "=== 产物列表 ==="
          - find . -name "*-1.0-SNAPSHOT.jar" -exec ls -lh {} \;