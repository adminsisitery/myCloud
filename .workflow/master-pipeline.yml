version: '1.0'
name: mycloud-ci
displayName: myCloud CI/CD 流水线

triggers:
  push:
    branches:
      include:
        - Microservices
        - master

variables:
  MAVEN_OPTS: "-DskipTests"
  JDK_VERSION: 21

stages:
  - stage: compile
    name: 编译阶段
    displayName: 编译
    steps:
      - step: build@maven
        name: maven-compile
        displayName: Maven 编译
        jdkVersion: ${JDK_VERSION}
        mavenVersion: 3.9.11
        commands:
          - mvn -DskipTests compile -q

  - stage: test
    name: 测试阶段
    displayName: 单元测试
    steps:
      - step: build@maven
        name: maven-test
        displayName: Maven 测试
        jdkVersion: ${JDK_VERSION}
        mavenVersion: 3.9.11
        commands:
          - mvn test -q
        artifacts:
          - name: test-report
            path:
              - "**/target/surefire-reports/*.xml"