# ============================================================
# Nacos 配置模板 —— 直接整体替换 pan-gateways 的内容
#
#   Data ID : pan-gateways
#   Group   : pan
#   格式    : YAML
#
# 相比原配置只增加了一段 globalcors（在 routes 同级、其下方）。
# 粘贴后在 Nacos 控制台「发布」，然后重启网关生效。
# ============================================================
spring:
  cloud:
    gateway:
      routes:
        # 用户身份与第三方登录同属用户域，统一走 user-service 的服务发现负载均衡
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**,/api/auth/github/**
        # 上传链路（普通上传/秒传判定/秒传执行/分片/直传/进度）拆到 file-upload-service
        - id: file-upload-service
          uri: lb://file-upload-service
          predicates:
            - Path=/api/chunk/**,/api/direct-upload/**,/api/upload-progress/**,/api/files/progress,/api/files/check,/api/files/fast-upload
        # 下载域：单文件流式下载（GET /api/files/{fileId}/content）、
        # 文件夹同步 ZIP（GET /api/file/{fileId}/content）与异步打包任务接口（/api/folder-download-tasks/**）
        # 统一由 file-download-service 承接；打包执行在 file-async-service，不影响 HTTP 路由
        - id: file-download-service
          uri: lb://file-download-service
          predicates:
            - Path=/api/files/*/content,/api/file/*/content,/api/folder-download-tasks,/api/folder-download-tasks/**
        # 文件预览（OSS 预签名 URL，GET /api/files/preview/{fileId}）独立拆到 file-preview-service
        - id: file-preview-service
          uri: lb://file-preview-service
          predicates:
            - Path=/api/files/preview,/api/files/preview/**
        # 文件搜索（GET /api/files/search）拆到独立 file-search-service；
        # 精确路径须排在 file-manage-service 路由之前，避免被 /api/files/** 吃掉
        - id: file-search-service
          uri: lb://file-search-service
          predicates:
            - Path=/api/files/search
        # 文件/文件夹管理（列表/新建文件夹/重命名/移动/复制/收藏/最近访问/回收站）拆到 file-manage-service；
        # 上传、下载、预览的精确路由排在本路由之前，优先匹配
        - id: file-manage-service
          uri: lb://file-manage-service
          predicates:
            - Path=/api/files,/api/files/**,/api/file/folder
        # 文件分享（创建/列表/取消/密码与Token校验/分享内容下载）拆到独立 file-share-service
        - id: file-share
          uri: lb://file-share-service
          predicates:
            - Path=/api/shares,/api/shares/**
        # 实时用量通知 WebSocket（端点 /ws/message 由 file-async-service 提供，握手时由端点自行校验 token）
        - id: file-async-service-ws
          uri: lb://file-async-service
          predicates:
            - Path=/ws/message
        # AI 对话 / Agent（SSE 流式）与管理端用量统计
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/**,/admin/ai/cost/**
        # 说明：单体（mycloud-backend）已退场，未匹配上述路由的请求由网关直接返回 404。

      # ============================================================
      # 跨域配置（CORS）
      #
      # 必须放在 globalcors 下：它由 RoutePredicateHandlerMapping 在路由匹配
      # 阶段处理，OPTIONS 预检不会进入 MyGlobalFilter 鉴权链。
      # 若改写成自定义 CorsWebFilter，顺序不可控，会出现"预检永远 401"。
      # ============================================================
      globalcors:
        # 必须为 true：否则命中不到路由的预检（如 /error）拿不到 CORS 响应头
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            # 允许来源。上线前把生产域名加进来，否则前端会被拒。
            # 本地开发：5173 是 Vite 默认端口
            allowed-origin-patterns:
              - "http://localhost:5173"
              - "http://127.0.0.1:5173"
              # - "https://你的生产域名"
            allowed-methods: "*"
            # 必须放开：Authorization 是自定义头，不放开预检直接失败
            allowed-headers: "*"
            # 下载接口靠 Content-Disposition 传文件名，
            # JS 默认读不到非安全响应头，不 expose 下载下来全叫 download
            exposed-headers:
              - Content-Disposition
              - Content-Length
            # 预检结果缓存 1 小时，减少 OPTIONS 往返
            max-age: 3600
            # 不需要 allow-credentials：token 走 Authorization 头不走 Cookie
            # （pan-sa-token 里 is-read-cookie: false），不存在凭据模式
    # 网关熔断：对象是路由而不是 Feign，所以规则类型是 gw-degrade，resource 填路由 ID
    # 注意：这里不能配 rule-type=degrade，那种规则对网关不生效
    sentinel:
      scg:
        # SentinelGatewayFilter 的执行顺序，要早于路由转发，
        # 否则拿不到 route id，规则匹配不上
        order: -1
        # 熔断打开时返回统一 JSON。不配的话是英文纯文本 "Blocked by Sentinel (flow limiting)"，
        # 前端解析不了，也没法区分是限流还是熔断
        fallback:
          mode: response
          response-status: 429
          content-type: application/json
          response-body: '{"code":429,"message":"下游服务暂时不可用，请稍后重试","data":null}'
      datasource:
        gw-degrade:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:47.95.192.221:8848}
            group-id: SENTINEL_GROUP
            data-id: gateway-gw-degrade-rules
            data-type: json
            rule-type: gw-degrade
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:}
