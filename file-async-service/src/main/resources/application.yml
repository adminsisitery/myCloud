# 本地只保留启动引导配置，其余业务配置全部托管到 Nacos（DEFAULT_GROUP）
# 共享配置：pan-common / pan-mysql / pan-redis / pan-mybatis-plus / pan-sa-token / pan-oss /
#           pan-rabbitmq / pan-mail / pan-ai / pan-elasticsearch
server:
  port: ${FILE_ASYNC_SERVICE_PORT:8086}

spring:
  application:
    name: file-async-service
  config:
    import:
      - "optional:nacos:pan-common?group=DEFAULT_GROUP&refreshEnabled=true"
      - "optional:nacos:pan-mysql?group=DEFAULT_GROUP&refreshEnabled=true"
      - "optional:nacos:pan-redis?group=DEFAULT_GROUP&refreshEnabled=true"
      - "optional:nacos:pan-mybatis-plus?group=DEFAULT_GROUP&refreshEnabled=true"
      - "optional:nacos:pan-sa-token?group=DEFAULT_GROUP&refreshEnabled=true"
      - "optional:nacos:pan-oss?group=DEFAULT_GROUP&refreshEnabled=true"
      - "optional:nacos:pan-rabbitmq?group=DEFAULT_GROUP&refreshEnabled=true"
      - "optional:nacos:pan-mail?group=DEFAULT_GROUP&refreshEnabled=true"
      - "optional:nacos:pan-ai?group=DEFAULT_GROUP&refreshEnabled=true"
      - "optional:nacos:pan-elasticsearch?group=DEFAULT_GROUP&refreshEnabled=true"
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:47.95.192.221:8848}
      # Nacos 开启鉴权后必须提供；密码不落库，走环境变量 NACOS_PASSWORD
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:}
      config:
        server-addr: ${NACOS_SERVER_ADDR:47.95.192.221:8848}
        group: DEFAULT_GROUP
        file-extension: yaml
        refresh-enabled: true
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:47.95.192.221:8848}
# 只有本服务声明 RabbitMQ 队列拓扑（消费端统一创建），其他服务只发消息
pan:
  rabbit:
    topology-enabled: true