services:
  mycloud-agent:
    build: .
    image: mycloud-agent:1.0
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - agent-logs:/app/logs
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 35s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  agent-logs:
