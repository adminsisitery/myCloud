# Woodpecker CI/CD Pipeline
# 每个 push 自动: 编译 → 打包 → 部署

pipeline:
  compile:
    image: maven:3.9-eclipse-temurin-21
    commands:
      - mvn -DskipTests compile -q

  package:
    image: maven:3.9-eclipse-temurin-21
    commands:
      - mvn -DskipTests package -q
      - echo "=== 产物 ==="
      - find . -name "*-1.0-SNAPSHOT.jar" -exec ls -lh {} \;

  deploy:
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/mycloud:/opt/mycloud
    commands:
      - cp ./*/target/*-1.0-SNAPSHOT.jar /opt/mycloud/
      - cd /opt/mycloud && docker-compose build && docker-compose up -d
      - sleep 30
      - wget -qO- http://localhost:8090/api/user/login --post-data='{"username":"test","password":"Test1234"}' --header='Content-Type: application/json' || true