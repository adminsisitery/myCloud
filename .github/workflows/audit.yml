name: 代码审计

# 审计对所有分支生效：它只读代码、不改产物，不存在部署风险，
# 早期发现问题比省 CI 分钟数更重要。
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  # 上传 SARIF 到 GitHub 代码扫描需要这个权限
  security-events: write

jobs:
  myrc:
    # myRC 尚未发布到 PyPI，必须从源码仓库拉取。
    # 源码在 Gitee（公开仓库），actions/checkout 只能拉 GitHub，
    # 所以这里用 git clone。想临时关掉审计，把仓库变量 MYRC_DISABLED 设为 true。
    if: vars.MYRC_DISABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 增量审计要拿 base 分支做 diff，浅克隆取不到
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 克隆 + 安装 + 装扫描器的公共逻辑，见 .github/actions/setup-myrc
      - uses: ./.github/actions/setup-myrc
        with:
          repo-url: ${{ vars.MYRC_REPO_URL || 'https://gitee.com/feifei-coder/airc.git' }}
          ref: ${{ vars.MYRC_REF || 'main' }}
          token: ${{ secrets.GITEE_TOKEN }}

      - name: 执行审计
        run: |
          set -uo pipefail
          # 默认只出报告不拦构建：存量问题（依赖 CVE 等）还没清完，
          # 先用 SARIF 在代码扫描里看，等 baseline 建好再把 MYRC_FAIL_ON 设为 high。
          args=(--repo . --fail-on "${{ vars.MYRC_FAIL_ON || 'none' }}")
          # 有基线时只报新增问题，历史债务不重复出现
          if [ -f .myrc-baseline.json ]; then
            args+=(--baseline .myrc-baseline.json)
          fi
          # PR 只审改动，push 做全量
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            args+=(--base "origin/${{ github.base_ref }}")
          fi
          # 先出 JSON：机器可读，用来统计各扫描器到底跑了多少。
          # SARIF 只给代码扫描用，看不出覆盖情况。
          echo "执行：myrc audit run ${args[*]} --format json"
          myrc audit run "${args[@]}" --format json --output myrc-report.json
          # 第二次换 SARIF 格式，扫描结果走缓存，只多几秒
          echo "执行：myrc audit run ${args[*]} --format sarif"
          myrc audit run "${args[@]}" --format sarif --output myrc.sarif

      # 把「每个扫描器扫出多少条」打进 Job Summary。
      # 只看「0 个问题」无法判断是真的干净，还是扫描器根本没跑起来。
      - name: 审计摘要
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib
          p = pathlib.Path("myrc-report.json")
          if not p.exists():
              print("未生成 myrc-report.json，审计未执行完。")
              raise SystemExit(0)
          r = json.loads(p.read_text(encoding="utf-8"))
          print(f"### 审计结果：{len(r.get('findings', []))} 个问题")
          print()
          print(f"- 文件：{r.get('files_scanned')}　耗时：{r.get('duration_seconds'):.0f}s"
                f"　缓存：{'命中' if r.get('cache_hit') else '未命中'}")
          print(f"- baseline 忽略：{r.get('baseline_count')}　内联抑制：{r.get('suppressed_count')}")
          print(f"- 决策：`{r.get('decision')}`")
          print()
          print("| 扫描器 | 发现 | 错误 | 耗时(s) |")
          print("| --- | ---: | ---: | ---: |")
          for m in r.get("scanner_metrics", []):
              print(f"| {m.get('name')} | {m.get('findings')} | {m.get('errors')} | "
                    f"{m.get('duration_seconds', 0):.1f} |")
          gaps = r.get("errors") or []
          if gaps:
              print()
              print(f"**覆盖缺口 {len(gaps)} 项**")
              print()
              print("| 扫描器 | 文件 | 原因 |")
              print("| --- | --- | --- |")
              for g in gaps[:20]:
                  print(f"| {g.get('scanner')} | {g.get('file') or '-'} | {g.get('message')} |")
          PY

      - name: 上传 SARIF 到代码扫描
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: myrc.sarif

      # 基线要在“工具链完整”的环境里生成：本机常常缺 semgrep、osv-scanner 会超时，
      # 用残缺工具链生成的基线会让 CI 把漏掉的部分当成新增。
      # 用法：commit message 里带 [baseline] 推一次，然后下载 myrc-baseline 产物覆盖仓库里的文件。
      - name: 生成基线（提交信息含 [baseline] 时）
        if: contains(github.event.head_commit.message, '[baseline]')
        run: |
          set -uo pipefail
          # 不带 --baseline：要的是全量指纹，否则旧基线会把自己过滤掉
          myrc audit baseline --repo . --output myrc-baseline.json

      - name: 上传基线
        if: contains(github.event.head_commit.message, '[baseline]')
        uses: actions/upload-artifact@v4
        with:
          name: myrc-baseline
          path: myrc-baseline.json
          if-no-files-found: error

      - name: 留档审计报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myrc-report
          # JSON 存全量明细（含扫描器指标、覆盖缺口），SARIF 给代码扫描
          path: |
            myrc.sarif
            myrc-report.json
          if-no-files-found: warn
