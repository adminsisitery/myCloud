name: 代码审计

# 审计对所有分支生效：它只读代码、不改产物，不存在部署风险，
# 早期发现问题比省 CI 分钟数更重要。
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  # 上传 SARIF 到 GitHub 代码扫描需要这个权限
  security-events: write

jobs:
  myrc:
    # myRC 尚未发布到 PyPI，必须从源码仓库拉取。
    # 源码在 Gitee（公开仓库），actions/checkout 只能拉 GitHub，
    # 所以这里用 git clone。想临时关掉审计，把仓库变量 MYRC_DISABLED 设为 true。
    if: vars.MYRC_DISABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 增量审计要拿 base 分支做 diff，浅克隆取不到
          fetch-depth: 0

      - name: 拉取 myRC（Gitee）
        env:
          MYRC_REPO_URL: ${{ vars.MYRC_REPO_URL || 'https://gitee.com/feifei-coder/airc.git' }}
          MYRC_REF: ${{ vars.MYRC_REF || 'main' }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          url="$MYRC_REPO_URL"
          # 公开仓库直接克隆，无需任何密钥；
          # 若将来转私有，配一个 secrets.GITEE_TOKEN（勾 projects 权限）即可，workflow 不用改。
          if [ -n "${GITEE_TOKEN:-}" ]; then
            url="https://oauth2:${GITEE_TOKEN}@${url#https://}"
          fi
          git clone --depth 1 "$url" .myrc-tool
          git -C .myrc-tool fetch --depth 1 origin "$MYRC_REF"
          git -C .myrc-tool checkout --detach FETCH_HEAD
          git -C .myrc-tool log --oneline -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 myRC
        run: |
          python -m pip install --upgrade pip
          pip install "./.myrc-tool[external,quality]"
          myrc --version

      - name: 执行审计
        run: |
          set -uo pipefail
          # 默认只出报告不拦构建：存量问题（依赖 CVE 等）还没清完，
          # 先用 SARIF 在代码扫描里看，等 baseline 建好再把 MYRC_FAIL_ON 设为 high。
          args=(--repo . --format sarif --output myrc.sarif --fail-on "${{ vars.MYRC_FAIL_ON || 'none' }}")
          # 有基线时只报新增问题，历史债务不重复出现
          if [ -f .myrc-baseline.json ]; then
            args+=(--baseline .myrc-baseline.json)
          fi
          # PR 只审改动，push 做全量
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            args+=(--base "origin/${{ github.base_ref }}")
          fi
          echo "执行：myrc audit run ${args[*]}"
          myrc audit run "${args[@]}"

      - name: 上传 SARIF 到代码扫描
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: myrc.sarif

      - name: 留档审计报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myrc-sarif
          path: myrc.sarif
          if-no-files-found: warn
