name: 代码审计

# 审计对所有分支生效：它只读代码、不改产物，不存在部署风险，
# 早期发现问题比省 CI 分钟数更重要。
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  # 上传 SARIF 到 GitHub 代码扫描需要这个权限
  security-events: write

jobs:
  myrc:
    # myRC 尚未发布到 PyPI，必须从源码仓库拉取。
    # 源码在 Gitee（公开仓库），actions/checkout 只能拉 GitHub，
    # 所以这里用 git clone。想临时关掉审计，把仓库变量 MYRC_DISABLED 设为 true。
    if: vars.MYRC_DISABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 增量审计要拿 base 分支做 diff，浅克隆取不到
          fetch-depth: 0

      - name: 拉取 myRC（Gitee）
        env:
          MYRC_REPO_URL: ${{ vars.MYRC_REPO_URL || 'https://gitee.com/feifei-coder/airc.git' }}
          MYRC_REF: ${{ vars.MYRC_REF || 'main' }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          url="$MYRC_REPO_URL"
          # 公开仓库直接克隆，无需任何密钥；
          # 若将来转私有，配一个 secrets.GITEE_TOKEN（勾 projects 权限）即可，workflow 不用改。
          if [ -n "${GITEE_TOKEN:-}" ]; then
            url="https://oauth2:${GITEE_TOKEN}@${url#https://}"
          fi
          # 必须克隆到工作区之外：myRC 自带 benchmarks/cases（故意写坏的样本代码），
          # 放进仓库里会被自己扫到，报出几十条误报。
          tool_dir="$RUNNER_TEMP/myrc-tool"
          git clone --depth 1 "$url" "$tool_dir"
          git -C "$tool_dir" fetch --depth 1 origin "$MYRC_REF"
          git -C "$tool_dir" checkout --detach FETCH_HEAD
          git -C "$tool_dir" log --oneline -1
          echo "MYRC_TOOL_DIR=$tool_dir" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 myRC
        run: |
          python -m pip install --upgrade pip
          # semgrep 走 Python 包；dependency-audit 带 pip-audit，缺了就没有依赖漏洞结论
          pip install "$MYRC_TOOL_DIR[semgrep,dependency-audit,external,quality]"
          myrc --version

      - name: 安装系统扫描器
        # 装不上不阻塞：缺失会记进报告的“覆盖缺口”，不会静默跳过
        continue-on-error: true
        run: |
          set -uo pipefail
          # gitleaks：密钥扫描（含 git 历史）
          tag=$(curl -sSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -1)
          if [ -n "$tag" ]; then
            ver="${tag#v}"
            curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/${tag}/gitleaks_${ver}_linux_x64.tar.gz" \
              | sudo tar -xz -C /usr/local/bin gitleaks
          fi
          # trivy：依赖 CVE + IaC/容器配置
          curl -sSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          # osv-scanner：跨生态依赖漏洞（Java 的 pom.xml 靠它，缺了依赖一项直接是缺口）
          osv_url=$(curl -sSL https://api.github.com/repos/google/osv-scanner/releases/latest \
            | grep -o '"browser_download_url": *"[^"]*linux_amd64[^"]*"' | head -1 | cut -d'"' -f4)
          if [ -n "$osv_url" ]; then
            sudo curl -sSL "$osv_url" -o /usr/local/bin/osv-scanner
            sudo chmod +x /usr/local/bin/osv-scanner
          fi
          gitleaks version || true
          trivy --version || true
          osv-scanner --version || true

      - name: 执行审计
        run: |
          set -uo pipefail
          # 默认只出报告不拦构建：存量问题（依赖 CVE 等）还没清完，
          # 先用 SARIF 在代码扫描里看，等 baseline 建好再把 MYRC_FAIL_ON 设为 high。
          args=(--repo . --format sarif --output myrc.sarif --fail-on "${{ vars.MYRC_FAIL_ON || 'none' }}")
          # 有基线时只报新增问题，历史债务不重复出现
          if [ -f .myrc-baseline.json ]; then
            args+=(--baseline .myrc-baseline.json)
          fi
          # PR 只审改动，push 做全量
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            args+=(--base "origin/${{ github.base_ref }}")
          fi
          echo "执行：myrc audit run ${args[*]}"
          myrc audit run "${args[@]}"

      - name: 上传 SARIF 到代码扫描
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: myrc.sarif

      - name: 留档审计报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myrc-sarif
          path: myrc.sarif
          if-no-files-found: warn
