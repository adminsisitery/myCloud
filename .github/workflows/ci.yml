name: myCloud CI/CD

on:
  push:
    branches: [Microservices, master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Compile
        run: mvn -Dmaven.test.skip=true compile -q

      - name: Test
        run: mvn test -q

      - name: Package
        run: mvn -Dmaven.test.skip=true package -q

      - name: Upload jars
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "*/target/*-1.0-SNAPSHOT.jar"
          target: /opt/mycloud/
          strip_components: 2

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/mycloud
            docker-compose build
            docker-compose up -d
            sleep 60
            docker-compose ps
            curl -s -XPOST localhost:8090/api/user/login -H 'Content-Type: application/json' -d '{"username":"test","password":"Test1234"}' || true