name: myCloud CI/CD

on:
  push:
    branches: [Microservices, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Compile
        run: mvn -DskipTests compile -q

      - name: Package
        run: mvn -DskipTests package -q

      - name: Upload jars
        uses: appleboy/scp-action@v0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "*/target/*-1.0-SNAPSHOT.jar"
          target: /opt/mycloud/
          strip_components: 2

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Restart services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/mycloud
            docker-compose build
            docker-compose up -d
            sleep 30
            docker-compose ps