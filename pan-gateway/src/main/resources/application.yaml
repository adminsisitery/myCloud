server:
  port: ${GATEWAY_PORT:8090}
spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
    gateway:
      routes:
        # 用户身份与第三方登录同属用户域，统一走 user-service 的服务发现负载均衡
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**,/api/auth/github/**
        # 上传链路（普通上传/秒传判定/秒传执行/分片/直传/进度）拆到 file-upload-service
        - id: file-upload-service
          uri: lb://file-upload-service
          predicates:
            - Path=/api/chunk/**,/api/direct-upload/**,/api/upload-progress/**,/api/files/progress,/api/files/check,/api/files/fast-upload
        # 单文件流式下载（GET /api/files/{fileId}/content，支持 Range 断点续传）独立拆到 file-download-service
        - id: file-download-service
          uri: lb://file-download-service
          predicates:
            - Path=/api/files/*/content
        # 文件/文件夹管理（列表/新建文件夹/重命名/移动/复制/收藏/最近访问/回收站）拆到 file-manage-service；
        # 上传、下载的精确路由排在本路由之前，优先匹配
        - id: file-manage-service
          uri: lb://file-manage-service
          predicates:
            - Path=/api/files,/api/files/**,/api/file/folder
        # 其余请求仍由单体承接（搜索/分享/预览/文件夹打包等），待后续拆分收敛
        - id: mycloud-backend
          uri: ${MYCLOUD_BACKEND_URI:http://localhost:8080}
          predicates:
            - Path=/**
sa-token:
  token-name: Authorization
  token-prefix: ""
  timeout: 2592000
  active-timeout: -1
  is-concurrent: false
  is-share: false
  is-read-header: true
  is-read-body: false
  is-read-cookie: false
  is-log: false
pan:
  user:
    exclude-paths:
      - /api/user/login
      - /api/user/register
      - /api/user/verification-code
      - /api/shares/**
      - /api/auth/github/**
      - /swagger-ui/**
      - /v3/api-docs
      - /v3/api-docs/**
      - /swagger-resources/**
      - /error