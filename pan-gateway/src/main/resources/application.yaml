# 本地只保留启动引导配置；网关路由、排除路径、Redis、sa-token 全部托管到 Nacos
# 共享配置：pan-common / pan-redis / pan-sa-token / pan-exclude-paths / pan-gateways
server:
  port: ${GATEWAY_PORT:8090}

spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  config:
    import:
      - "optional:nacos:pan-common?group=pan&refreshEnabled=true"
      - "optional:nacos:pan-redis?group=pan&refreshEnabled=true"
      - "optional:nacos:pan-sa-token?group=pan&refreshEnabled=true"
      - "optional:nacos:pan-exclude-paths?group=pan&refreshEnabled=true"
      - "optional:nacos:pan-gateways?group=pan&refreshEnabled=true"
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:47.95.192.221:8848}
      # Nacos 开启鉴权后必须提供；密码不落库，走环境变量 NACOS_PASSWORD
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:}
      config:
        server-addr: ${NACOS_SERVER_ADDR:47.95.192.221:8848}
        group: DEFAULT_GROUP
        file-extension: yaml
        refresh-enabled: true
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:47.95.192.221:8848}
