# 本地只保留启动引导配置；网关路由、排除路径、Redis、sa-token 全部托管到 Nacos
# 共享配置：pan-common / pan-redis / pan-sa-token / pan-exclude-paths / pan-gateways
server:
  port: ${GATEWAY_PORT:8090}

spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  config:
    import:
      - "optional:nacos:pan-common?group=DEFAULT_GROUP&refreshEnabled=true"
      - "optional:nacos:pan-redis?group=DEFAULT_GROUP&refreshEnabled=true"
      - "optional:nacos:pan-sa-token?group=DEFAULT_GROUP&refreshEnabled=true"
      - "optional:nacos:pan-exclude-paths?group=DEFAULT_GROUP&refreshEnabled=true"
      - "optional:nacos:pan-gateways?group=DEFAULT_GROUP&refreshEnabled=true"
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        group: DEFAULT_GROUP
        file-extension: yaml
        refresh-enabled: true
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
