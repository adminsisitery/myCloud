# Redisson配置
# Sa-Token配置
sa-token:
  # token名称
  token-name: Authorization
  # token有效期
  timeout: 2592000
  # token临时有效期
  active-timeout: -1
  # 是否允许同一账号并发登录
  is-concurrent: false
  # 在多人登录同一账号时，是否共用一个token
  is-share: false
  # token风格
  token-style: uuid
  # 是否输出操作日志
  is-log: true
  # 是否尝试从请求体里读取token
  is-read-body: true
  # 是否尝试从header里读取token
  is-read-header: true
  # 是否尝试从cookie里读取token
  is-read-cookie: true
  # token前缀
  token-prefix: ""
  # 使用 Redis Jackson DAO 存储 Sa-Token 数据
  dao: redisJackson


