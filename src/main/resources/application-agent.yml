# Agent-only overlay. Existing application/local settings retain infrastructure and model choices.
ai:
  web-search-enabled: ${AI_WEB_SEARCH_ENABLED:false}
  pgvector:
    host: ${PGVECTOR_HOST:localhost}
    port: ${PGVECTOR_PORT:5432}
    user: ${PGVECTOR_USER:mycloud}
    password: ${PGVECTOR_PASSWORD:}
    database: ${PGVECTOR_DATABASE:mycloud}
    table: ${PGVECTOR_TABLE:file_segment}
    create-table: false
  agent:
    max-concurrent-runs: ${AGENT_MAX_CONCURRENT_RUNS:8}
    timeout-seconds: 300
    max-steps: 6
    max-model-calls: 20
    max-tool-calls: 20
    max-output-tokens: 2048
    max-context-chars: 48000
    max-total-tokens: 60000
    action-expiry-minutes: 15
langfuse:
  enabled: ${LANGFUSE_ENABLED:false}
  capture-content: false
logging:
  level:
    dev.langchain4j: WARN
    com.ff.mycloud.ai: INFO
management:
  endpoint:
    health:
      show-details: never
