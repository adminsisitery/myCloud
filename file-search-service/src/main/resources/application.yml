# 本地只保留启动引导配置，其余业务配置全部托管到 Nacos（DEFAULT_GROUP）
# 共享配置：pan-common / pan-mysql / pan-redis / pan-mybatis / pan-sa-token / pan-elasticsearch
# 服务独有配置：file-search-service（file.search 检索策略）
server:
  port: ${FILE_SEARCH_SERVICE_PORT:8089}

spring:
  application:
    name: file-search-service
  config:
    import:
      - "optional:nacos:pan-common?group=pan&refreshEnabled=true"
      - "optional:nacos:pan-mysql?group=pan&refreshEnabled=true"
      - "optional:nacos:pan-redis?group=pan&refreshEnabled=true"
      - "optional:nacos:pan-mybatis?group=pan&refreshEnabled=true"
      - "optional:nacos:pan-sa-token?group=pan&refreshEnabled=true"
      - "optional:nacos:pan-elasticsearch?group=pan&refreshEnabled=true"
      - "optional:nacos:file-search-service?group=pan&refreshEnabled=true"
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:47.95.192.221:8848}
      # Nacos 开启鉴权后必须提供；密码不落库，走环境变量 NACOS_PASSWORD
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:}
      config:
        server-addr: ${NACOS_SERVER_ADDR:47.95.192.221:8848}
        group: DEFAULT_GROUP
        file-extension: yaml
        refresh-enabled: true
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:47.95.192.221:8848}
